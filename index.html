<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backyard Pod Orbit Scene</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      .scene-toolbar {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: calc(100vw - 32px);
        pointer-events: none;
      }

      .scene-toolbar button {
        pointer-events: auto;
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(5, 5, 5, 0.76);
        color: #f4efe8;
        font: 600 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-width: 92px;
        height: 36px;
        padding: 0 13px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .scene-toolbar button:hover {
        background: rgba(24, 24, 24, 0.9);
      }

      .scene-toolbar button:focus-visible {
        outline: 2px solid #7a8cff;
        outline-offset: 2px;
      }

      .scene-toolbar button.is-active {
        border-color: rgba(120, 140, 255, 0.82);
        background: rgba(25, 31, 58, 0.92);
      }

      .pov-reticle {
        position: fixed;
        left: 50%;
        top: 50%;
        z-index: 9;
        width: 12px;
        height: 12px;
        border: 1px solid rgba(255, 255, 255, 0.68);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }

      .pov-reticle[hidden] {
        display: none;
      }

      .light-panel {
        position: fixed;
        top: 64px;
        left: 16px;
        z-index: 12;
        width: min(300px, calc(100vw - 32px));
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: rgba(8, 9, 11, 0.92);
        color: #f4efe8;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.46);
        font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .light-panel[hidden] {
        display: none;
      }

      .light-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        font-weight: 700;
      }

      .light-panel button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #f4efe8;
        width: 28px;
        height: 28px;
        cursor: pointer;
      }

      .light-control {
        display: grid;
        gap: 6px;
        margin-top: 11px;
      }

      .light-control label {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: rgba(244, 239, 232, 0.82);
      }

      .light-control input[type="range"] {
        width: 100%;
      }

      .light-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .mobile-pov-controls {
        position: fixed;
        inset: 0;
        z-index: 11;
        pointer-events: none;
      }

      .mobile-pov-controls[hidden] {
        display: none;
      }

      .mobile-look-pad {
        position: absolute;
        inset: 88px 0 86px 42%;
        pointer-events: auto;
        touch-action: none;
      }

      .mobile-move-pad {
        position: absolute;
        left: max(14px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(3, 46px);
        gap: 7px;
        pointer-events: auto;
      }

      .mobile-pov-actions {
        position: absolute;
        right: max(14px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }

      .mobile-pov-controls button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 8px;
        background: rgba(5, 5, 5, 0.72);
        color: #f4efe8;
        min-width: 46px;
        height: 46px;
        padding: 0 14px;
        font: 700 15px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
        touch-action: none;
      }

      .mobile-move-pad button {
        padding: 0;
      }

      .mobile-move-pad [data-move="forward"] {
        grid-column: 2;
        grid-row: 1;
      }

      .mobile-move-pad [data-move="left"] {
        grid-column: 1;
        grid-row: 2;
      }

      .mobile-move-pad [data-move="back"] {
        grid-column: 2;
        grid-row: 3;
      }

      .mobile-move-pad [data-move="right"] {
        grid-column: 3;
        grid-row: 2;
      }

      @media (hover: hover) and (pointer: fine) {
        .mobile-pov-controls {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene-toolbar">
      <button id="povButton" type="button" title="Enter first-person POV mode" aria-pressed="false">Enter POV</button>
      <button id="wallCutawayButton" type="button" title="Toggle wall transparency" aria-pressed="false">Wall Cutaway</button>
      <button id="sim4Button" type="button" title="Toggle Sim4 floorplane mode" aria-pressed="false">Sim4</button>
    </div>
    <div id="povReticle" class="pov-reticle" hidden></div>
    <div id="mobilePovControls" class="mobile-pov-controls" hidden aria-label="Mobile POV controls">
      <div id="mobileLookPad" class="mobile-look-pad" aria-hidden="true"></div>
      <div class="mobile-move-pad" aria-label="Move">
        <button type="button" data-move="forward" aria-label="Move forward">↑</button>
        <button type="button" data-move="left" aria-label="Move left">←</button>
        <button type="button" data-move="right" aria-label="Move right">→</button>
        <button type="button" data-move="back" aria-label="Move back">↓</button>
      </div>
      <div class="mobile-pov-actions">
        <button id="mobileLightButton" type="button">Light</button>
        <button id="mobileExitPovButton" type="button">Exit</button>
      </div>
    </div>
    <section id="lightPanel" class="light-panel" hidden aria-label="Downlight controls">
      <header>
        <span>Downlights</span>
        <button id="closeLightPanel" type="button" aria-label="Close downlight controls">x</button>
      </header>
      <label class="light-toggle">
        <input id="lightPower" type="checkbox" checked />
        <span>Lights on</span>
      </label>
      <div class="light-control">
        <label for="lightBrightness">
          <span>Brightness</span>
          <span id="lightBrightnessValue">100%</span>
        </label>
        <input id="lightBrightness" type="range" min="0" max="100" value="100" />
      </div>
      <div class="light-control">
        <label for="lightTemperature">
          <span>Temperature</span>
          <span id="lightTemperatureValue">3000K</span>
        </label>
        <input id="lightTemperature" type="range" min="2200" max="6500" value="3000" step="50" />
      </div>
      <div class="light-control">
        <label for="lightColor">
          <span>Color tint</span>
        </label>
        <input id="lightColor" type="color" value="#ffffff" />
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
